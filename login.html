<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout Attendance Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container auth-container">
    <p class="eyebrow">Scout Attendance</p>
    <h1>Login</h1>
    <p class="subtitle">Adult Leaders can log in here.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <p id="message" class="message" aria-live="polite"></p>
    <p class="auth-link">Adult Leader without an account? <a href="register.html">Register</a></p>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
